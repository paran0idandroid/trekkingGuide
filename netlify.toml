[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Identity redirects for Netlify Identity widget
[[redirects]]
  from = "/.netlify/identity/*"
  to = "/.netlify/identity/*"
  status = 200

[functions]
  directory = "netlify/functions"
